{{ define "main" }}
  {{ .Content }}

  {{ if site.Params.mascot.enable }}
    <div class="mascot" aria-hidden="true">
      <img src="{{ site.Params.mascot.image | relURL }}" alt="" />
      <div class="mascot-bubble"><span>{{ site.Params.mascot.text }}</span></div>
      <span class="mascot-dot dot-big"></span>
      <span class="mascot-dot dot-small"></span>
    </div>
  {{ end }}
{{ end }}
