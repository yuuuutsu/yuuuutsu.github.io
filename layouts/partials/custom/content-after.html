<!-- 图片灯箱：点击文章里的图片放大查看，可左右切换、点击遮罩或按 Esc 关闭 -->
<style>
  .lb-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: zoom-out;
    padding: 24px;
    touch-action: pan-y;
  }
  .lb-overlay.open { display: flex; }
  .lb-overlay img {
    max-width: 94vw;
    max-height: 86vh;
    width: auto;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    cursor: default;
    user-select: none;
    -webkit-user-drag: none;
  }
  .lb-caption {
    margin-top: 12px;
    color: #eee;
    font-size: 14px;
    max-width: 90vw;
    text-align: center;
    overflow-wrap: break-word;
  }
  .lb-counter {
    position: fixed;
    top: 16px;
    left: 20px;
    color: #ddd;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.4);
    padding: 4px 10px;
    border-radius: 12px;
  }
  .lb-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .lb-btn:hover { background: rgba(0, 0, 0, 0.75); }
  .lb-prev { left: 16px; }
  .lb-next { right: 16px; }
  .lb-close {
    position: fixed;
    top: 14px;
    right: 16px;
    width: 38px;
    height: 38px;
    font-size: 18px;
  }
  @media (max-width: 640px) {
    .lb-prev { left: 6px; }
    .lb-next { right: 6px; }
  }
  .content img { cursor: zoom-in; }
</style>

<div class="lb-overlay" id="lightbox" aria-hidden="true">
  <div class="lb-counter" id="lightbox-counter"></div>
  <button class="lb-btn lb-close" id="lightbox-close" title="关闭 (Esc)">✕</button>
  <button class="lb-btn lb-prev" id="lightbox-prev" title="上一张 (←)">‹</button>
  <img src="" alt="" id="lightbox-img" />
  <button class="lb-btn lb-next" id="lightbox-next" title="下一张 (→)">›</button>
  <div class="lb-caption" id="lightbox-caption"></div>
</div>

<script>
  (function () {
    var overlay   = document.getElementById('lightbox');
    var bigImg    = document.getElementById('lightbox-img');
    var caption   = document.getElementById('lightbox-caption');
    var counter   = document.getElementById('lightbox-counter');
    var btnPrev   = document.getElementById('lightbox-prev');
    var btnNext   = document.getElementById('lightbox-next');
    var btnClose  = document.getElementById('lightbox-close');

    var imgs = Array.prototype.slice.call(document.querySelectorAll('.content img'));
    var idx = 0;
    var startX = null;

    function show(i) {
      if (imgs.length === 0) return;
      idx = (i + imgs.length) % imgs.length;  // 循环切换
      var img = imgs[idx];
      bigImg.src = img.src;
      bigImg.alt = img.alt || '';
      caption.textContent = img.alt || '';
      counter.textContent = (idx + 1) + ' / ' + imgs.length;
      btnPrev.style.display = imgs.length > 1 ? 'flex' : 'none';
      btnNext.style.display = imgs.length > 1 ? 'flex' : 'none';
    }

    function open(i) {
      show(i);
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      bigImg.src = '';
      startX = null;
    }

    imgs.forEach(function (img, i) {
      img.addEventListener('click', function () { open(i); });
    });

    btnPrev.addEventListener('click', function (e) { e.stopPropagation(); show(idx - 1); });
    btnNext.addEventListener('click', function (e) { e.stopPropagation(); show(idx + 1); });
    btnClose.addEventListener('click', close);

    // 点背景关闭；点图片本身切换到下一张
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) close();
    });
    bigImg.addEventListener('click', function () { show(idx + 1); });

    // 键盘：← → 切换，Esc 关闭
    document.addEventListener('keydown', function (e) {
      if (!overlay.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === 'ArrowRight') show(idx + 1);
    });

    // 手机滑动切换
    overlay.addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX;
    }, { passive: true });
    overlay.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      if (dx > 50) show(idx - 1);        // 右滑 = 上一张
      else if (dx < -50) show(idx + 1);  // 左滑 = 下一张
      startX = null;
    }, { passive: true });
  })();
</script>
