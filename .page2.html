<div class="lb-overlay" id="lightbox" aria-hidden="true">
  <div class="lb-counter" id="lightbox-counter"></div>
  <button class="lb-btn lb-close" id="lightbox-close" title="关闭 (Esc)">✕</button>
  <button class="lb-btn lb-prev" id="lightbox-prev" title="上一张 (←)">‹</button>
  <img src="" alt="" id="lightbox-img" />
  <button class="lb-btn lb-next" id="lightbox-next" title="下一张 (→)">›</button>
  <div class="lb-caption" id="lightbox-caption"></div>
</div>

<script>
  (function () {
    var overlay   = document.getElementById('lightbox');
    var bigImg    = document.getElementById('lightbox-img');
    var caption   = document.getElementById('lightbox-caption');
    var counter   = document.getElementById('lightbox-counter');
    var btnPrev   = document.getElementById('lightbox-prev');
    var btnNext   = document.getElementById('lightbox-next');
    var btnClose  = document.getElementById('lightbox-close');

     
    var imgs = Array.prototype.slice.call(document.querySelectorAll('.content img:not([width])'));
    imgs = imgs.filter(function (img) {
      if (img.getAttribute('src').indexOf('/stickers/') !== -1) return false;
      if (img.closest && (img.closest('.deceased-portrait') || img.closest('.deceased-tablet') || img.closest('.ritual'))) return false;
      return true;
    });

     
    if (document.querySelector('.deceased-portrait')) {
      document.body.classList.add('page-deceased');
    }
    var idx = 0;
    var startX = null;

    function show(i) {
      if (imgs.length === 0) return;
      idx = (i + imgs.length) % imgs.length;  
      var img = imgs[idx];
      bigImg.src = img.src;
      bigImg.alt = img.alt || '';
      caption.textContent = img.alt || '';
      counter.textContent = (idx + 1) + ' / ' + imgs.length;
      btnPrev.style.display = imgs.length > 1 ? 'flex' : 'none';
      btnNext.style.display = imgs.length > 1 ? 'flex' : 'none';
    }

    function open(i) {
      show(i);
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      bigImg.src = '';
      startX = null;
    }

    imgs.forEach(function (img, i) {
      img.addEventListener('click', function () { open(i); });
    });

    btnPrev.addEventListener('click', function (e) { e.stopPropagation(); show(idx - 1); });
    btnNext.addEventListener('click', function (e) { e.stopPropagation(); show(idx + 1); });
    btnClose.addEventListener('click', close);

    
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) close();
    });
    bigImg.addEventListener('click', function () { show(idx + 1); });

    
    document.addEventListener('keydown', function (e) {
      if (!overlay.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === 'ArrowRight') show(idx + 1);
    });

    
    overlay.addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX;
    }, { passive: true });
    overlay.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      if (dx > 50) show(idx - 1);        
      else if (dx < -50) show(idx + 1);  
      startX = null;
    }, { passive: true });
  })();
</script>
