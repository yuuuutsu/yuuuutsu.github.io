baseURL = 'https://yuuuutsu.github.io/'
locale = 'zh-cn'
timeZone = 'Asia/Shanghai'
title = '有信心'
theme = "hugo-toigian"

# 生成 robots.txt（配合 layouts/robots.txt 让搜索引擎不收录）
enableRobotsTXT = true

[params]
  # 网站图标（浏览器标签页上的小标志）
  favicon = "/favicon.jpg"
  # 右侧目录开关
  toc = true
  # 评论开关（未配置评论服务，先关闭）
  comments = false
  # 博客建立日期（页脚会显示「从这天到今天共多少天」）
  blogStart = "2026-09-19"
  [params.author]
    name = "Blogger"
    email = "me@example.com"

  # 首页右下角的小人 + 对话框竖排文字
  [params.mascot]
    enable = true
    image = "/images/mascot-nobubble.png"
    # 想改气泡里的字，改下面这一行就行
    text = "。。。"

# 文章里的 Markdown 语法设置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许在文章里直接写 HTML（span 字号/颜色等）
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# 顶部导航菜单
[menu]
  [[menu.nav]]
    name = "About"
    url = "/about"
    weight = 1
  [[menu.nav]]
    name = "Archive"
    url = "/posts"
    weight = 2
  [[menu.nav]]
    name = "Gallery"
    url = "/gallery"
    weight = 3

# 关闭 Hugo 对 Node 工具的沙箱限制（toigian 主题构建 CSS 需要）
[security.node.permissions]
  disable = true
